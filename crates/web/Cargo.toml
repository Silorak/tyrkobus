[package]
name = "web"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
chrono-tz = "0.10.4"
csv = "1.4.0"
maud = { version = "0.27.0", features = ["axum"] }
pdf2gtfs = { version = "0.1.0", path = "../pdf2gtfs" }
planner = { version = "0.1.0", path = "../planner" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip"] }

[dev-dependencies]
tempfile = "3.27.0"
