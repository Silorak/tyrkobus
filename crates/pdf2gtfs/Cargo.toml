[package]
name = "pdf2gtfs"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
csv = "1.4.0"
encoding_rs = "0.8.44"
osmpbf = "0.3.8"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
ureq = "3.5.2"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
